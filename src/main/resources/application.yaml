server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:boilerplate}}
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD:strongpassword123!}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

  sql:
    init:
      mode: never

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true # 데이터 소스 초기화 지연 (JPA 설정 후 실행)

# JWT & Security 설정 (환경변수 주입)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXP:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXP:86400000}
  cookie-secure: false # 운영 시 ture

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}