server:
  port: 8080

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  config:
    import: optional:file:.env
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${POSTGRES_DB:boilerplate}}
    username: ${POSTGRES_USER:myuser}
    password: ${POSTGRES_PASSWORD:strongpassword123!}
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

  # ── Google OAuth2 설정 ──────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # 요청할 권한 범위: 이메일과 프로필 정보
            scope:
              - email
              - profile
            # Spring Security 기본 콜백 URI (Google Console에 등록 필수)
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            # Google의 OIDC Discovery 엔드포인트 (자동으로 authorization/token/userInfo URI 설정)
            issuer-uri: https://accounts.google.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: list
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

# JWT & Security 설정 (환경변수 주입)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXP:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXP:86400000}
  cookie-secure: ${COOKIE_SECURE}

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
  oauth2:
    # OAuth2 인증 성공/실패 후 리다이렉트될 프론트엔드 URI
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}